<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-lig  ht">
<div class="container mt-5">

<h2 class="text-center mb-4">User List</h2>
<h4 th:if="${success}" class="text-success"></h4>
<a th:href="@{/user/welcome}" class="btn btn-success mb-3">
Add User
</a>
			<table class="table table-bordered table-striped">
			<thead class="table-info">
			<tr>
			<th>ID</th>
			<th>Name</th>
			<th>Email</th>
			<th>Phone</th>
			<th>Update Account</th>
			<th>Delete Account</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each=" user: ${userList}">
			<td th:text="${user.userId}"></td>
			<td th:text="${user.name}"></td>
			<td th:text="${user.email}"></td>
			<td th:text="${user.phone}"></td>
			<td>
				<a th:href="@{/user/getById/{userId}(userId=${user.userId})}" class="btn btn-warning btn-sm">Update</a>
			</td>
			<td>
				<a th:href="@{/user/delete/{userId}(userId=${user.userId})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete?')">Delete</a>
			</td>
			</tr>
           </tbody>
		   </table>

	</div>
</body>
</html>
