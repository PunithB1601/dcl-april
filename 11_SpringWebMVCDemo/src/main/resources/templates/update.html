<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
	<div class="card shadow">
		<div class="class-header bg-primary text-white">
			<h3 class="text-center">Update User</h3>
		</div>
		
		<div class="card-body">
			
			<form th:action="@{/user/update}" th:object="${user}" method="POST">
				<div class="mb-3">
					<label>User Name:</label>
					<input type="text" class="form-control" th:field="*{name}">
				</div>
				
				<div class="mb-3">
					<label>User Mail:</label>
					<input type="email" class="form-control" th:field="*{email}">
				</div>
				
				<div class="mb-3">
					<label>User Phone:</label>
					<input type="tel" class="form-control" th:field="*{phone}">
				</div>
					<input type="hidden" th:field="*{userId}" value="${user.userId}">
				<button class="btn btn-success">Update</button>
				<a href="@{/user/get}" class="btn btn-danger">Back</a>	
			</form>
		
		
		</div>
	</div>
</div>

</body>
</html>
